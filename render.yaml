# Render Blueprint — deploys the CargoPulse API (server/) as a Web Service,
# backed by a free managed Postgres database.
# Docs: https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this repo to GitHub.
#   2. On Render: New -> Blueprint -> select this repo -> Apply.
#   3. After the client is deployed (e.g. on Vercel), update CLIENT_URL below
#      (or in the Render dashboard) to your client's real URL for CORS.
#   4. Redis is optional — the app runs fine without it (built-in in-memory
#      cache fallback). To enable it, create a free Redis instance
#      (e.g. Upstash) and set REDIS_URL in the Render dashboard.

databases:
  - name: cargopulse-db
    plan: free
    databaseName: cargopulse_db
    user: cargopulse

services:
  - type: web
    name: cargopulse-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://your-cargopulse-app.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: cargopulse-db
          property: connectionString
      - key: REDIS_URL
        sync: false
